# Publica el sitio en GitHub Pages cada vez que se sube un cambio a la rama main.
# Configuración previa (una sola vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Carpeta donde vive el sitio. Mientras se usa la dirección de GitHub
          # (jleteliervalenzuela-code.github.io/digitalweb/) debe ser /digitalweb/.
          # Al conectar el dominio digitalgmas.cl, cámbiala a: /
          RUTA_BASE: /digitalweb/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@v4
